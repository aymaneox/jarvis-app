name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          cp -r tools /tmp/tools_backup
          flutter create --platforms=android --project-name jarvis_app --org com.kaido .
          cp -r /tmp/lib_backup/. lib/
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          rm -rf test

      - name: Generate app icon images
        run: |
          pip install pillow
          python3 /tmp/tools_backup/make_icon.py

      - name: Patch Android manifest
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          add = ('<uses-permission android:name="android.permission.INTERNET"/>\n'
                 '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
                 '    <uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>\n'
                 '    <queries>\n'
                 '        <intent><action android:name="android.speech.RecognitionService"/></intent>\n'
                 '        <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>\n'
                 '    </queries>\n'
                 '    ')
          s = s.replace('<application', add + '<application', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Jarvis"', s, count=1)
          open(p, 'w').write(s)
          PY

      - run: flutter pub get

      - name: Apply app icon
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: build/app/outputs/flutter-apk/app-release.apk
