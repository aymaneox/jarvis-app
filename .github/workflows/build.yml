name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          cp -r tools /tmp/tools_backup
          cp -r android_extra /tmp/android_extra_backup
          flutter create --platforms=android --project-name jarvis_app --org com.kaido .
          cp -r /tmp/lib_backup/. lib/
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          rm -rf test

      - name: Add native Android code
        run: |
          mkdir -p android/app/src/main/kotlin/com/kaido/jarvis_app
          cp /tmp/android_extra_backup/*.kt android/app/src/main/kotlin/com/kaido/jarvis_app/
          ls android/app/src/main/kotlin/com/kaido/jarvis_app/
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
          cat > android/app/src/main/res/xml/jarvis_accessibility.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/jarvis_a11y_desc"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews|flagReportViewIds"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="100" />
          XML
          cat > android/app/src/main/res/values/jarvis_strings.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="jarvis_a11y_desc">Lets Jarvis scroll, tap, type, press system buttons and take screenshots when you ask by voice.</string>
          </resources>
          XML

      - name: Generate app icon images
        run: |
          pip install pillow
          python3 /tmp/tools_backup/make_icon.py

      - name: Patch Android manifest
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ['INTERNET', 'RECORD_AUDIO', 'FOREGROUND_SERVICE',
                   'FOREGROUND_SERVICE_MICROPHONE', 'POST_NOTIFICATIONS',
                   'SYSTEM_ALERT_WINDOW', 'WAKE_LOCK', 'VIBRATE', 'QUERY_ALL_PACKAGES', 'READ_CONTACTS',
                   'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS']
          add = ''.join('<uses-permission android:name="android.permission.%s"/>\n    ' % x for x in perms)
          add += '<uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>\n    '
          add += ('<queries>\n'
                  '        <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent>\n'
                  '        <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>\n'
                  '    </queries>\n'
                  '    ')
          s = s.replace('<application', add + '<application', 1)
          svc = ('<service android:name=".KeepAliveService" android:exported="false" android:foregroundServiceType="microphone"/>\n'
                 '    <service android:name=".JarvisAccessibilityService" android:exported="true" android:label="Jarvis control" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">\n'
                 '        <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>\n'
                 '        <meta-data android:name="android.accessibilityservice" android:resource="@xml/jarvis_accessibility"/>\n'
                 '    </service>\n'
                 '    <service android:name=".JarvisNotificationService" android:exported="true" android:label="Jarvis notifications" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">\n'
                 '        <intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter>\n'
                 '    </service>\n'
                 '    ')
          s = s.replace('</application>', svc + '</application>', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Jarvis"', s, count=1)
          open(p, 'w').write(s)
          PY

      - name: Disable lint crash
        run: |
          python3 - <<'PY2'
          import os, re
          for p in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              if os.path.exists(p):
                  s = open(p).read()
                  if 'checkReleaseBuilds' not in s:
                      block = 'android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n'
                      s = re.sub(r'android\s*\{', lambda m: block, s, count=1)
                      open(p, 'w').write(s)
                  print('patched', p)
          PY2

      - run: flutter pub get

      - name: Raise compileSdk of old plugins
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          for d in "$CACHE"/hosted/pub.dev/flutter_voice_processor-* "$CACHE"/hosted/pub.dev/porcupine_flutter-*; do
            f="$d/android/build.gradle"
            if [ -f "$f" ]; then
              sed -i -E -e 's/(compileSdk(Version)?[ =]+)[0-9]+/\1_X_/' -e 's/_X_/35/' "$f"
              echo "patched $f"
              grep -n "compileSdk" "$f" || true
            fi
          done

      - name: Apply app icon
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: build/app/outputs/flutter-apk/app-release.apk
