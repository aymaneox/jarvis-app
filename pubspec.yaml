name: jarvis_app
description: My Jarvis assistant
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  flutter_tts: ^4.0.0
  android_intent_plus: ^5.0.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.0
  porcupine_flutter: ^3.0.0
  flutter_voice_processor: any

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#06121C"
  adaptive_icon_foreground: "assets/icon_fg.png"

flutter:
  uses-material-design: true
